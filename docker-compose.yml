version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facial_attendance_system
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Facial Attendance System
      - DATABASE_URL=sqlite:///./data/attendance.db
      - RECOGNITION_COOLDOWN_SECONDS=6
      - SIMILARITY_THRESHOLD=0.363
      - YUNET_SCORE_THRESHOLD=0.6
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persistent SQLite database and face encodings cache
      - ./data:/app/data
      # Persistent student uploaded photos
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
